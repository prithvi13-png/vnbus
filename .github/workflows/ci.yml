name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vnbus
          POSTGRES_USER: vnbus
          POSTGRES_PASSWORD: vnbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vnbus -d vnbus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vnbus:vnbus@localhost:5432/vnbus?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-with-strong-length
      JWT_REFRESH_SECRET: ci-refresh-secret-with-strong-length
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      REQUEST_BODY_LIMIT: 1mb
      SUPPLIER_MODE: mock
      PAYMENT_PROVIDER: MOCK
      EMAIL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm prisma:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm security:audit

  docker-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/api/Dockerfile -t vnbus-api:${{ github.sha }} .
      - run: docker build -f apps/api/Dockerfile.worker -t vnbus-worker:${{ github.sha }} .
      - run: docker build -f apps/api/Dockerfile.scheduler -t vnbus-scheduler:${{ github.sha }} .
      - run: docker build -f apps/web/Dockerfile -t vnbus-web:${{ github.sha }} .

  deployment-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deployment is gated for the production environment. Configure registry push and hosting provider credentials before enabling automatic rollout."
