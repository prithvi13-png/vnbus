services:
  - type: web
    name: vnbus-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Vriddhi Nexus Bus
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: MAINTENANCE_MODE
        value: "false"
      - key: SUPPLIER_MODE
        value: mock
      - key: PAYMENT_PROVIDER
        value: MOCK
      # Email is live via Resend. The key is a secret and EMAIL_FROM changes
      # once vriddhinexus.com is verified, so both are dashboard-managed
      # (sync: false) rather than pinned here — a literal value in this file
      # would overwrite the dashboard on the next blueprint sync.
      # If RESEND_API_KEY is missing the API falls back to the mock sender and
      # logs an error, so a half-configured environment fails loudly, not silently.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PROMETHEUS_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: info
